# Rize Haber Android uygulamasını derler ve APK'yı indirilebilir dosya olarak yükler.
# Çalıştırmak için: GitHub → Actions → "Rize Haber APK" → "Run workflow"
# (rize-haber/ klasörüne her push'ta da otomatik çalışır.)
name: Rize Haber APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'rize-haber/**'
      - '.github/workflows/rize-haber-apk.yml'

concurrency:
  group: rize-haber-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rize-haber

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rize-haber/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Testler, tip kontrolü ve lint
        run: |
          npm test
          npx tsc --noEmit
          npm run lint

      - name: Android projesini oluştur
        run: npx expo prebuild --platform android --no-install

      # Kalıcı imza anahtarı depo Secrets'ta tanımlıysa onu kullan; değilse hata ayıklama anahtarıyla
      # derlemeye devam et ve uyar. Şifreler hiçbir dosyaya ya da kayda yazılmaz.
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.RIZE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RIZE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RIZE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RIZE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "RIZE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "RIZE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "RIZE_KEY_ALIAS=${KEY_ALIAS:-rizehaber}"
              echo "RIZE_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Kalıcı imza anahtarı kullanılacak."
          else
            echo "::warning title=İmza anahtarı yok::RIZE_KEYSTORE_BASE64 tanımlı değil; APK hata ayıklama anahtarıyla imzalanıyor (Play Store'a yüklenemez)."
          fi

      - name: APK derle
        working-directory: rize-haber/android
        run: ./gradlew assembleRelease --no-daemon

      - name: İmzayı doğrula
        run: |
          APK=$(ls rize-haber/android/app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          if [ -n "$RIZE_KEYSTORE_PATH" ] && "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::Kalıcı anahtar tanımlı ama APK hata ayıklama anahtarıyla imzalanmış."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rize-haber-apk
          path: rize-haber/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # APK'yı Android emülatöründe açar; açılışta çöken bir sürüm "başarılı" görünmesin.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rize-haber-apk
          path: apk

      - name: KVM'yi etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde aç
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash rize-haber/scripts/smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-kayitlari
          path: smoke/
          retention-days: 14
