plugins { id 'com.android.application' }
android {
    namespace 'com.sonkat.game'
    compileSdk 34
    defaultConfig {
        applicationId "com.sonkat.game"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }
    /* DENEME anahtarı: depo herkese açık olduğu için anahtar da açıktır.
       Her sürüm aynı imzayla çıkar, telefonda eskisinin üstüne güncellenir.
       Play Store için bu anahtar KULLANILMAZ; ayrı, gizli bir anahtar gerekir. */
    signingConfigs {
        test {
            storeFile file('sonkat-test.jks')
            storePassword 'sonkat-test'
            keyAlias 'sonkat'
            keyPassword 'sonkat-test'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.test }
        release { minifyEnabled false; signingConfig signingConfigs.test }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
